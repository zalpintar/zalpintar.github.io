<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja spletna stran</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #0077cc;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        #smesko {
            font-size: 3rem;
            position: absolute;
            top: 60px;
            left: 0;
            animation: premik 4s linear infinite alternate;
        }

        @keyframes premik {
            from { left: 0; }
            to { left: calc(100% - 60px); }
        }
    </style>
</head>
<body>

    <div id="smesko">😎</div>

    <h1>Naslov lepša stran</h1>
    <p>Pozdravljeni.</p>

</body>
</html>
